<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quiet Waters</title>
    <meta name="description" content="A household's daily prayer from Scripture, by the pond." />
    <meta name="theme-color" content="#0f3a3e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Quiet Waters" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      /* Before the app's own CSS arrives: the right colour for the hour,
         so a 06:45 open never flashes white. */
      html, body { margin: 0; background: #0f3a3e; }
      html.night, html.night body { background: #0b1426; }
    </style>
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('h');
          var h = q != null ? parseFloat(q) : new Date().getHours();
          if (h < 7 || h >= 19) document.documentElement.className = 'night';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
