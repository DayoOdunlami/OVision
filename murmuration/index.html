<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#141a36" />
    <meta name="description" content="An experiment: a murmuration of starlings at dusk." />
    <title>Murmuration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Source+Sans+3:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #141a36; overflow: hidden; }
      .mm-stage { position: fixed; inset: 0; touch-action: none; }
      .mm-stage canvas { display: block; }
      .mm-note {
        position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 2;
        font: 400 14px/1.4 'Source Sans 3', system-ui, sans-serif; color: rgba(241, 235, 220, 0.75);
      }
      .mm-note a { color: inherit; }
      .mm-note em { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.2em; color: #f1ebdc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/murmuration/main.jsx"></script>
  </body>
</html>
